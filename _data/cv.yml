- title: Research Experience
  type: time_table
  contents:
    - title: Iran National Elites Foundation
      year: Sept.2017-Aug.2019
      location: Tehran, Iran
      maindescription: Full-Time Research Engineer
      description: Worked full-time under a governmental research grant. The project was about proposing an optimal design for electrical circuits in ships to reduce electromagnetic noise, costs, and increase reliability.
    - title: Master Dissertation
      year: Sept.2014-Sept.2016
      location: Zanjan, Iran
      # maindescription: Electrical Engineer
      description: The objective was to apply the Model Predictive Control (MPC) method to interface power electronics converters, aiming to increase efficiency and improve power quality ["Modeling and modern control of distributed generation systems based on microturbine and storage for intelligent operation of the distribution networks"].
    - title: Member of TOSAN Surface Vehicle group
      year: Apr.2012-Oct.2014
      location: Tabriz, Iran
      maindescription: Electrical Engineer
      description: I contributed to the electronics and control parts of the Tosan surface vehicle, a student-based project financially supported by the university. Our efforts earned us nominations for several awards, including the admirable prize at the sixth national Harkat festival, Sharif University of Technology, Iran.
    - title: Multi-output LED driver for balancing rectifier DC-link voltage
      year: Sept.2013-Sept.2014
      location: Tabriz, Iran
      # maindescription: Electrical Engineer
      description: The objective of this project was to design a reliable multi-output circuit capable of maintaining stable voltages across all branches. The circuit achieved stability at different voltage levels on all outputs while ensuring sinusoidal currents.

