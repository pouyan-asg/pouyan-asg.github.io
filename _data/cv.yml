      year: April 2024-present
      location: Montreal, Canada
      # maindescription: Part-time Volunteer Researcher
      description: Developing an automated laboratory workflow using the Mecademic Meca500 robotic arm, with a focus on reducing task-specific hard coding. Designed a human-in-the-loop robotic system combining vision language models (VLMs) and interactive imitation learning to enable intuitive teaching and adaptation of lab processes.
    - title: National Research Council (NRC), Canada
      year: Jan.2024-Feb.2024
      location: Montreal, Canada
      maindescription: Part-time Volunteer Researcher
      description: As a part-time volunteer researcher, contributed to electronic circuit design and robotic simulation for a collaborative cobotic drilling project.
    - title: Acrylic Robotics
      year: Sept.2022-Oct.2023
      location: Montreal, Canada
      # maindescription: Part-time Volunteer Researcher
      description: Robotics engineering intern at an art-tech startup, contributing to the development and deployment of robotic systems for automated art production. Led hands-on integration and operation of Mecademic Meca500 and Kinova robotic arms, and supported live demos, exhibitions, and technical workshops.
    - title: Noavaran Sabz Farda (NSF) company
      year: June 2020-Sept.2020
      location: Rasht, Iran
      # maindescription: Part-time Volunteer Researcher
